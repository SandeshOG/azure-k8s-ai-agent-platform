apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-platform
  labels:
    app: ai-agent-platform
    author: sandesh-lanjewar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-platform
  template:
    metadata:
      labels:
        app: ai-agent-platform
    spec:
      containers:
      - name: agent
        image: azure-k8s-ai-agent-platform:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: AUTHOR
          value: "Sandesh Lanjewar"